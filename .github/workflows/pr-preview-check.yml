name: PR Preview Check

# Cross-repo E2E gate for aivorah-frontend PRs, without duplicating any test
# code into that repo. aivorah-frontend's CircleCI pipeline (see its
# .circleci/config.yml `trigger-e2e` job) fires this via repository_dispatch
# once a PR's Vercel preview deployment is live, passing that preview's real
# URL + commit SHA. This runs the same 6 smoke specs smoke.yml uses (fast,
# read-only, 3 personas) against that PR's own preview instead of the fixed
# master preview, then reports a commit status back onto aivorah-frontend's
# SHA so the result is visible on that PR even though the test code and its
# execution never leave this repo.
on:
  repository_dispatch:
    types: [frontend-pr-preview]

env:
  BACKEND_URL: https://aivorah.ai
  E2E_PARENT_K: e2e.parent.k@aivorah.test
  SCHEDULE_SERVICE_URL: https://aivorah-schedule-service.onrender.com
  CHALLENGES_SERVICE_URL: https://aivorah-challenges-service.onrender.com
  LEADERBOARD_SERVICE_URL: https://aivorah-leaderboard-service.onrender.com
  ASSIGNMENTS_SERVICE_URL: https://aivorah-assignments-service.onrender.com
  PROFILE_SERVICE_URL: https://aivorah-profile-service.onrender.com
  TEACHER_DASHBOARD_SERVICE_URL: https://aivorah-teacher-dashboard-service.onrender.com
  LEARNING_PATHS_SERVICE_URL: https://aivorah-learning-paths-service.onrender.com
  STUDENTS_SERVICE_URL: https://aivorah-students-service.onrender.com
  DAILY_HABITS_SERVICE_URL: https://aivorah-daily-habits-service.onrender.com
  WORLD_AND_YOU_SERVICE_URL: https://aivorah-world-and-you-service.onrender.com
  AI_COACH_SERVICE_URL: https://aivorah-ai-coach-service.onrender.com
  BEDTIME_STORIES_SERVICE_URL: https://aivorah-bedtime-stories-service.onrender.com
  HELP_SERVICE_URL: https://aivorah-help-center-service.onrender.com
  AUTH_SERVICE_URL: https://aivorah-auth-service.onrender.com
  # The PR's own live preview, passed in by aivorah-frontend's dispatch -
  # not the fixed master preview smoke.yml uses.
  BASE_URL: ${{ github.event.client_payload.base_url }}
  TARGET_REPO: ${{ github.event.client_payload.source_repo }}
  TARGET_SHA: ${{ github.event.client_payload.sha }}

jobs:
  set-pending-status:
    runs-on: ubuntu-latest
    steps:
      - name: Mark aivorah-frontend commit as pending
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.FRONTEND_STATUS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${TARGET_REPO}/statuses/${TARGET_SHA}" \
            -d '{"state":"pending","context":"e2e/smoke (aivorah-e2e-tests)","description":"Running smoke suite against PR preview...","target_url":"'"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"}'

  setup:
    needs: set-pending-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome
      - name: Log in the 3 smoke accounts + snapshot profiles
        run: node tests/ci/setup.mjs
        env:
          ACCOUNT_FILTER: 'parent-a,student-a,teacher-a'
          E2E_PARENT_A: ${{ secrets.E2E_PARENT_A }}
          E2E_STUDENT_A: ${{ secrets.E2E_STUDENT_A }}
          E2E_TEACHER_A: ${{ secrets.E2E_TEACHER_A }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      - name: Upload sessions + snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-session
          path: |
            .auth/**
            .profile-snapshot.json
          include-hidden-files: true
          retention-days: 1

  test:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome
      - name: Download sessions + snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-session
      - name: Run smoke specs against the PR preview
        id: run
        run: |
          npx playwright test \
            tests/parent/b2b-login.spec.js \
            tests/parent/dashboard/dashboard.spec.js \
            tests/student/b2b-login.spec.js \
            tests/student/learning-paths.spec.js \
            tests/teacher/b2b-login.spec.js \
            tests/teacher/dashboard/dashboard.spec.js \
            --reporter=html
        env:
          PLAYWRIGHT_SKIP_GLOBAL_HOOKS: 'true'
          B2B_PARENT_EMAIL: ${{ secrets.B2B_PARENT_EMAIL }}
          B2B_PARENT_PASSWORD: ${{ secrets.B2B_PARENT_PASSWORD }}
          B2B_STUDENT_EMAIL: ${{ secrets.B2B_STUDENT_EMAIL }}
          B2B_STUDENT_PASSWORD: ${{ secrets.B2B_STUDENT_PASSWORD }}
          B2B_TEACHER_EMAIL: ${{ secrets.B2B_TEACHER_EMAIL }}
          B2B_TEACHER_PASSWORD: ${{ secrets.B2B_TEACHER_PASSWORD }}
          E2E_PARENT_A: ${{ secrets.E2E_PARENT_A }}
          E2E_STUDENT_A: ${{ secrets.E2E_STUDENT_A }}
          E2E_TEACHER_A: ${{ secrets.E2E_TEACHER_A }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-html-report
          path: playwright-report
          retention-days: 7

  report-status:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result back onto aivorah-frontend's commit
        run: |
          RESULT="${{ needs.test.result }}"
          STATE="failure"
          [ "$RESULT" = "success" ] && STATE="success"
          DESC="Smoke suite ${RESULT} against PR preview"
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.FRONTEND_STATUS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${TARGET_REPO}/statuses/${TARGET_SHA}" \
            -d '{"state":"'"$STATE"'","context":"e2e/smoke (aivorah-e2e-tests)","description":"'"$DESC"'","target_url":"'"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"}'
