version: 2.1

# Runs ONLY the B03 grading-correctness regression spec
# (tests/student/assignments/b03-grading-correctness-regression.spec.js),
# on demand, against the same real staging targets e2e.yml (GitHub Actions)
# already uses. This repo's full/nightly regression suite still lives in
# .github/workflows/e2e.yml — this CircleCI pipeline is intentionally
# narrow: one spec, one job, no shards, no ~90-account setup. It reuses
# scripts/run-scoped-spec.mjs (already existed for exactly this — scoping
# local/CI runs to only the accounts one spec declares via
# REQUIRED_ACCOUNTS) instead of duplicating that logic here.
#
# Required CircleCI project env vars (Project Settings > Environment
# Variables) — only what this one spec's REQUIRED_ACCOUNTS (['student-r'])
# needs, not the full ~90-secret set GitHub Actions carries:
#   E2E_STUDENT_R, E2E_PASSWORD, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   NVIDIA_NIM_API_KEY

jobs:
  b03-grading-correctness:
    docker:
      - image: mcr.microsoft.com/playwright:v1.48.0-jammy
    resource_class: medium
    environment:
      BASE_URL: https://aivorah-frontend-git-master-aivorah24-9470s-projects.vercel.app
      BACKEND_URL: https://aivorah.ai
      ASSIGNMENTS_SERVICE_URL: https://aivorah-assignments-service.onrender.com
      PROFILE_SERVICE_URL: https://aivorah-profile-service.onrender.com
    steps:
      - checkout
      # The playwright:v1.48.0-jammy image ships an older Node.js, but
      # @supabase/supabase-js's realtime client requires Node 22+ (native
      # WebSocket) - matches the Node 22 GitHub Actions already pins via
      # actions/setup-node in e2e.yml/smoke.yml.
      - run:
          name: Install Node.js 22
          command: |
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
            node --version
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps chromium
      - run:
          name: Run B03 regression spec (scoped to student-r only)
          command: node scripts/run-scoped-spec.mjs tests/student/assignments/b03-grading-correctness-regression.spec.js --reporter=line
      - store_artifacts:
          path: recordings
          destination: recordings
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  b03-regression:
    jobs:
      - b03-grading-correctness
